[project]
name = "kairos"
version = "0.1.0"
description = "Farm-level extreme weather alerts & advisories (olive first)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "httpx>=0.27",
  "cdsapi>=0.7.7",
  "xarray>=2026.9.0",
  "netcdf4>=1.7.5",
  "geopandas>=1.2.0",
  "pyogrio>=0.13.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kairos"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/extract_raif.py" = ["EXE001", "C408"]
