<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kairos Olive Alerts</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kairos">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23556b2f'/%3E%3Cpath d='M16 44c10 2 24-6 32-26-14 2-28 8-32 26z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23556b2f'/%3E%3Cpath d='M16 44c10 2 24-6 32-26-14 2-28 8-32 26z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#111114; --sub:#6b6b73; --line:#e3e3e8; --accent:#556b2f; --accent-soft:#e8eedb;
  --info:#6b8aa8; --low:#c9a400; --moderate:#e07b00; --high:#d32f2f; --severe:#7b1fa2;
  --bar:rgba(249,249,251,.88);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --sub:#98989f; --line:#2c2c2e; --accent:#a3c066; --accent-soft:#26301a;
    --info:#8fb0cf; --low:#e6c229; --moderate:#ff9f0a; --high:#ff6b6b; --severe:#d58cf0; --bar:rgba(28,28,30,.88);
  }
}
:root[data-theme="dark"]{
  --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --sub:#98989f; --line:#2c2c2e; --accent:#a3c066; --accent-soft:#26301a;
  --info:#8fb0cf; --low:#e6c229; --moderate:#ff9f0a; --high:#ff6b6b; --severe:#d58cf0; --bar:rgba(28,28,30,.88);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{position:relative;height:100%;max-width:430px;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:600px){
  body{background:#1a1a1d;display:flex;align-items:center;justify-content:center}
  #app{height:844px;width:390px;border-radius:44px;box-shadow:0 0 0 10px #000,0 30px 80px rgba(0,0,0,.5)}
}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(90px + env(safe-area-inset-bottom));
  padding-top:calc(env(safe-area-inset-top) + 8px);display:none}
.screen.on{display:block}
h1{font-size:32px;line-height:1.1;margin:10px 0 2px;letter-spacing:-.5px}
.sub{color:var(--sub);font-size:14px}
.banner{display:flex;gap:8px;align-items:center;background:var(--accent-soft);color:var(--text);border-radius:12px;padding:8px 12px;font-size:12.5px;margin:10px 0}
.banner b{background:var(--accent);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;letter-spacing:.5px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
select{font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);max-width:60%}
.date{font-size:24px;font-weight:700;letter-spacing:-.3px}
input[type=range]{width:100%;accent-color:var(--accent);margin:10px 0 2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button.pill{border:0;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13.5px;padding:8px 12px;border-radius:999px}
button.pill:active{opacity:.6}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--accent-soft);color:var(--text);font-size:12.5px;padding:3px 9px;border-radius:999px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.tile{background:var(--bg);border-radius:12px;padding:8px 6px;text-align:center}
.tile b{display:block;font-size:18px}
.tile span{font-size:11px;color:var(--sub)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.strip{display:flex;gap:1px;height:26px;margin-top:8px;align-items:flex-end;touch-action:none}
.strip i{flex:1;min-width:1px;background:var(--line);border-radius:1px;height:30%}
.strip i.s1{background:var(--info);height:45%}.strip i.s2{background:var(--low);height:60%}
.strip i.s3{background:var(--moderate);height:80%}.strip i.s4{background:var(--high);height:100%}.strip i.s5{background:var(--severe);height:100%}
.strip i.cur{outline:2px solid var(--text);outline-offset:1px}
.alert{display:flex;gap:10px;background:var(--card);border-radius:16px;padding:12px;margin:10px 0;border-left:5px solid var(--sevc,var(--info))}
.alert .dot{width:34px;height:34px;border-radius:10px;background:var(--sevc);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.alert h3{margin:0;font-size:16px}
.alert p{margin:3px 0 0;font-size:13.5px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.alert .meta{font-size:12px;color:var(--sub);margin-top:4px}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--sevc);border-radius:6px;padding:1px 6px;text-transform:uppercase;margin-right:6px}
.empty{text-align:center;color:var(--sub);padding:22px 10px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--sub);margin:18px 4px 4px}
.obs{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.obs:last-child{border:0}.obs small{color:var(--sub);display:block;font-size:12px}
.obs b{white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabbar button{flex:1;border:0;background:none;color:var(--sub);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .25s ease;z-index:11}
.sheet.on{transform:none}
.grab{width:40px;height:5px;background:var(--line);border-radius:3px;margin:0 auto 12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px;margin-top:10px}.kv div:nth-child(odd){color:var(--sub)}
.warn{background:#fff4e0;color:#6b4a00;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:12px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .warn{background:#3a2c0d;color:#ffd98a}}
a{color:var(--accent)}
svg.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
</style>
</head>
<body>
<div id="app">
  <section id="today" class="screen on"></section>
  <section id="risk" class="screen"></section>
  <section id="field" class="screen"></section>
  <section id="about" class="screen"></section>
  <nav class="tabbar" id="tabs"></nav>
  <div class="sheet-bg" id="sbg"></div>
  <div class="sheet" id="sheet"></div>
</div>
<script id="payload" type="application/json">/*__DATA__*/null</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("payload").textContent);
const SEV = {info:{c:"var(--info)",r:0,l:"Info",i:"i"},low:{c:"var(--low)",r:1,l:"Low",i:"!"},moderate:{c:"var(--moderate)",r:2,l:"Moderate",i:"!"},
  high:{c:"var(--high)",r:3,l:"High",i:"!!"},severe:{c:"var(--severe)",r:4,l:"Severe",i:"!!"}};
const HAZ = {heat:"Heat stress",frost:"Frost",frost_inflorescence:"Frost on flower buds",cold_warning:"Cold warning",wind:"Strong wind",
  wind_hot_dry:"Hot dry wind",peacock_spot_infection:"Peacock spot infection risk",olive_fly_heat_suppression:"Olive fly: heat slows it",
  saissetia_heat_mortality:"Black scale: heat kills young",verticillium:"Verticillium soil-temperature",heavy_rain:"Heavy rain",
  frost_after_deacclimation:"Frost after warm spell",insufficient_chilling:"Insufficient chilling",olive_fly:"Olive fly",anthracnose:"Anthracnose",peacock_spot:"Peacock spot"};
const STG = {dormancy_chilling:"Dormancy",budbreak_shoot_growth:"Bud break",inflorescence_development:"Flower buds",flowering_anthesis:"Flowering",
  fruit_set:"Fruit set",pit_hardening:"Pit hardening",fruit_growth_oil_accumulation:"Fruit growth",ripening_harvest:"Ripening / harvest",post_harvest_recovery:"Post-harvest"};
const MET = {phenology_stage:"Stage reported",repilo_leaf_pct:"Peacock spot, leaves",repilo_plomizo_leaf_pct:"Repilo (plomizo), leaves",repilo_plots_pct:"Peacock spot, plots",
  fly_punctured_pct:"Fly punctured fruit",fly_punctured_total_pct:"Fly punctured fruit (total)",fly_punctured_live_pct:"Fly punctured, live",
  fly_trap_per_day:"Fly trap captures",fly_mcphail_per_trap_day:"Fly McPhail trap /day",fly_chromotropic_per_trap_day:"Fly chromotropic /day",
  prays_adults_per_trap_day:"Prays adults /trap/day",prays_carpofaga_fruit_pct:"Prays on fruit",prays_filofaga_shoots_pct:"Prays on shoots"};
const hz = h => HAZ[h] || h.replace(/_/g," ").replace(/^./,c=>c.toUpperCase());
const $ = id => document.getElementById(id);
const fmt = (v,d=1) => v==null ? "–" : (+v).toFixed(d);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const N = D.dates.length;
const jul = D.dates.indexOf("2025-07-20");
const S = {tab:"today", prov:(D.provinces.find(p=>p.code==="23")||D.provinces[0]).code, i: jul>=0?jul:Math.floor(N/2), showInfo:false};
try { const q=JSON.parse(localStorage.getItem("kairos")||"{}"); if(q.prov && D.feat[q.prov]) S.prov=q.prov; } catch(e){}
try { const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("p") && D.feat[h.get("p")]) S.prov=h.get("p");
  if(h.get("d") && D.dates.includes(h.get("d"))) S.i=D.dates.indexOf(h.get("d"));
  if(["today","risk","field","about"].includes(h.get("tab"))) S.tab=h.get("tab"); } catch(e){}
const save = () => { try{localStorage.setItem("kairos",JSON.stringify({prov:S.prov}))}catch(e){} };

const icons = {
  today:'<svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.01"/></svg>',
  risk:'<svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 4-7 5 5"/><path d="M3 21h18"/></svg>',
  field:'<svg viewBox="0 0 24 24"><path d="M5 20c0-8 5-13 14-14-1 9-6 14-14 14z"/><path d="M5 20l7-7"/></svg>',
  about:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>'};
const TABS = [["today","Alerts"],["risk","Weather"],["field","Field"],["about","About"]];
$("tabs").innerHTML = TABS.map(([k,l])=>`<button data-t="${k}">${icons[k]}<span>${l}</span></button>`).join("");
$("tabs").onclick = e => { const b=e.target.closest("button"); if(b){S.tab=b.dataset.t; render();} };

const prov = () => D.provinces.find(p=>p.code===S.prov);
const dayAlerts = (code,date) => (D.alerts[code]||{})[date]||[];
const sortA = a => a.slice().sort((x,y)=>SEV[y[2]].r-SEV[x[2]].r);
const topSev = (code,date) => dayAlerts(code,date).reduce((m,a)=>Math.max(m,SEV[a[2]].r),-1);
const F = (k,i=S.i) => D.feat[S.prov][k][i];
function stagesOn(date){
  const cal={dormancy_chilling:["11-15","02-15"],budbreak_shoot_growth:["02-15","03-31"],inflorescence_development:["03-15","04-30"],
    flowering_anthesis:["04-25","06-10"],fruit_set:["05-15","06-30"],pit_hardening:["06-15","07-31"],
    fruit_growth_oil_accumulation:["07-15","10-31"],ripening_harvest:["10-01","12-31"],post_harvest_recovery:["11-15","02-15"]};
  const k=date.slice(5);
  return Object.entries(cal).filter(([,[a,b]])=>a<=b?(k>=a&&k<=b):(k>=a||k<=b)).map(([n])=>n);
}
const gddCum = i => D.feat[S.prov].gdd_base9_1.slice(0,i+1).reduce((s,v)=>s+(v||0),0);
const longDate = d => new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"long",year:"numeric"});

function renderToday(){
  const date=D.dates[S.i], A=sortA(dayAlerts(S.prov,date)), main=A.filter(a=>a[2]!=="info"), info=A.filter(a=>a[2]==="info");
  const st=stagesOn(date), gdd=gddCum(S.i), pct=Math.min(100,gdd/495*100);
  const strip=D.dates.map((d,i)=>{const t=topSev(S.prov,d);return `<i class="${t>=0?"s"+(t+1):""}${i===S.i?" cur":""}" data-i="${i}"></i>`}).join("");
  $("today").innerHTML=`
  <h1>Olive alerts</h1><div class="sub">Weather-triggered advice by province</div>
  <div class="banner"><b>REPLAY</b><span>Real ERA5 weather from 2025, played back as if it were today. Not a forecast.</span></div>
  <div class="card">
    <div class="row"><select id="prov">${D.provinces.map(p=>`<option value="${p.code}"${p.code===S.prov?" selected":""}>${esc(p.name)}</option>`).join("")}</select>
      <span class="sub">${prov().olive_ha.toLocaleString()} ha olive</span></div>
    <div class="date" style="margin-top:12px">${longDate(date)}</div>
    <input type="range" id="slider" min="0" max="${N-1}" value="${S.i}">
    <div class="strip" id="strip">${strip}</div>
    <div class="sub" style="font-size:11px;margin-top:3px">Colour = most severe alert each day · tap to jump</div>
    <div class="btns"><button class="pill" data-a="prev">◀ Day</button><button class="pill" data-a="next">Day ▶</button>
      <button class="pill" data-a="nextalert">Next alert ▶▶</button><button class="pill" data-a="worst">Worst day</button></div>
    <div class="chips">${st.map(s=>`<span class="chip">${STG[s]||s}</span>`).join("")||'<span class="chip">Off-season</span>'}</div>
    <div class="tiles"><div class="tile"><b>${fmt(F("tmax_c"),0)}°</b><span>High</span></div><div class="tile"><b>${fmt(F("tmin_c"),0)}°</b><span>Low</span></div>
      <div class="tile"><b>${fmt(F("precip_mm"),1)}</b><span>Rain mm</span></div><div class="tile"><b>${fmt(F("wet_hours_8_24c"),0)}</b><span>Wet hours</span></div></div>
    <div class="sub" style="margin-top:10px;font-size:12.5px">Bloom model: ${fmt(gdd,0)} of 495 degree-days to full flowering ${gdd>=495?"· reached":""}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
  </div>
  <h2>Alerts today</h2>
  ${main.length?main.map(alertCard).join(""):'<div class="card empty">No weather-triggered alerts for this day.</div>'}
  ${info.length?`<h2 id="infoh" style="cursor:pointer">${S.showInfo?"▾":"▸"} ${info.length} informational</h2>${S.showInfo?info.map(alertCard).join(""):""}`:""}
  <div class="sub" style="font-size:12px;margin:14px 4px">Only weather rules are shown. ${D.meta.rules_not_evaluable} of ${D.meta.rules_evaluable+D.meta.rules_not_evaluable} table rules need field scouting or other data (see About).</div>`;
  $("prov").onchange=e=>{S.prov=e.target.value;save();render()};
  $("slider").oninput=e=>{S.i=+e.target.value;renderToday()};
  $("strip").onclick=e=>{const t=e.target.closest("i");if(t){S.i=+t.dataset.i;renderToday()}};
  $("today").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a));
  $("today").querySelectorAll("[data-r]").forEach(c=>c.onclick=()=>openSheet(c.dataset.r,c.dataset.n));
  const ih=$("infoh"); if(ih) ih.onclick=()=>{S.showInfo=!S.showInfo;renderToday()};
}
function alertCard(a){
  const s=SEV[a[2]], r=D.rules[a[0]]||{}, lead=r.lead_time_h?` · act within ${r.lead_time_h} h`:"";
  const thr=`${a[5]} ${a[6]} ${a[7]}`.replace("&gt;",">");
  return `<div class="alert" style="--sevc:${s.c}" data-r="${esc(a[0])}" data-n="${a[4]}"><div class="dot">${s.i}</div><div style="min-width:0">
    <h3><span class="tag">${s.l}</span>${esc(hz(a[1]))}</h3><p>${esc(r.action||"")}</p>
    <div class="meta">Reading ${a[4]} vs ${esc(thr)}${lead}</div></div></div>`;
}
function act(a){
  const code=S.prov; let i=S.i;
  if(a==="prev") S.i=Math.max(0,i-1);
  if(a==="next") S.i=Math.min(N-1,i+1);
  if(a==="nextalert"){ for(let j=i+1;j<N;j++){ if(topSev(code,D.dates[j])>=1){S.i=j;break} } }
  if(a==="worst"){ let b=-1,bj=i; for(let j=0;j<N;j++){const t=topSev(code,D.dates[j]); if(t>b){b=t;bj=j}} S.i=bj; }
  renderToday();
}
function openSheet(id,val){
  const r=D.rules[id]; if(!r) return;
  const s=SEV[r.severity]||SEV.info;
  const thr=Array.isArray(r.threshold)?r.threshold.join("–"):r.threshold;
  $("sheet").innerHTML=`<div class="grab"></div>
   <div><span class="tag" style="--sevc:${s.c}">${s.l}</span> <b style="font-size:19px">${esc(hz(r.hazard))}</b></div>
   <p style="font-size:15px;margin:10px 0 0">${esc(r.action)}</p>
   <div class="kv"><div>Why it fired</div><div>Reading <b>${esc(val)}</b> ${esc(r.operator)} ${esc(thr)} ${esc(r.unit)}${r.proxy_note?`<br><span class="sub">${esc(r.proxy_note)}</span>`:""}</div>
     <div>Stage</div><div>${r.stages.map(x=>STG[x]||x).join(", ")}</div>
     <div>Act within</div><div>${r.lead_time_h?r.lead_time_h+" hours":"not specified"}</div>
     <div>Confidence</div><div>${esc(r.confidence||"n/a")}</div>
     <div>Source note</div><div style="font-size:13px">${esc((r.window_notes||"").slice(0,320))}</div>
     <div>Rule ID</div><div>${esc(r.rule_id)}</div>
     ${r.source_url?`<div>Source</div><div><a href="${esc(r.source_url)}" target="_blank" rel="noopener">Open reference</a></div>`:""}</div>
   <div class="warn"><b>Pending agronomist review.</b> This threshold comes from literature and has not been validated for local conditions.</div>`;
  $("sheet").classList.add("on"); $("sbg").classList.add("on");
}
const closeSheet=()=>{$("sheet").classList.remove("on");$("sbg").classList.remove("on")};
$("sbg").onclick=closeSheet;

function chart(from,to,series){ // series: tmax,tmin,rain,wet
  const W=358,H=170,P={l:30,r:8,t:10,b:22}, n=to-from+1, x=k=>P.l+(W-P.l-P.r)*k/Math.max(1,n-1);
  const tv=[]; for(let k=from;k<=to;k++){tv.push(F("tmax_c",k),F("tmin_c",k))}
  const lo=Math.floor(Math.min(...tv)/5)*5, hi=Math.ceil(Math.max(...tv)/5)*5, y=v=>P.t+(H-P.t-P.b)*(1-(v-lo)/(hi-lo||1));
  let g=""; for(let v=lo;v<=hi;v+=5) g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l-4}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--sub)">${v}</text>`;
  [30,35].forEach(t=>{ if(t>lo&&t<hi) g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--high)" stroke-dasharray="4 3" opacity=".6"/>` });
  let mx="",mn="",rain="",marks="";
  for(let k=from;k<=to;k++){const j=k-from; mx+=`${j?"L":"M"}${x(j)},${y(F("tmax_c",k))}`; mn+=`${j?"L":"M"}${x(j)},${y(F("tmin_c",k))}`;
    const r=F("precip_mm",k)||0; if(r>0.05){const h=Math.min(40,r*3); rain+=`<rect x="${x(j)-1.5}" y="${H-P.b-h}" width="3" height="${h}" fill="var(--info)" opacity=".7"/>`}
    const t=topSev(S.prov,D.dates[k]); if(t>=2) marks+=`<circle cx="${x(j)}" cy="${P.t-2}" r="3" fill="${Object.values(SEV)[t].c}"/>`}
  const cur=x(S.i-from);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}${rain}<path d="${mn}" fill="none" stroke="var(--info)" stroke-width="2"/><path d="${mx}" fill="none" stroke="var(--moderate)" stroke-width="2"/>${marks}
   <line x1="${cur}" x2="${cur}" y1="${P.t}" y2="${H-P.b}" stroke="var(--text)" opacity=".5"/>
   <text x="${P.l}" y="${H-6}" font-size="10" fill="var(--sub)">${D.dates[from].slice(5)}</text><text x="${W-P.r}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--sub)">${D.dates[to].slice(5)}</text></svg>`;
}
function wetBars(from,to){
  const W=358,H=70,P={l:30,r:8,t:6,b:16}, n=to-from+1, bw=(W-P.l-P.r)/n;
  let b=""; for(let k=from;k<=to;k++){const v=F("wet_hours_8_24c",k)||0,h=(H-P.t-P.b)*v/24; b+=`<rect x="${P.l+(k-from)*bw}" y="${H-P.b-h}" width="${Math.max(1,bw-.5)}" height="${h}" fill="var(--accent)" ${k===S.i?'stroke="var(--text)"':""}/>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><text x="${P.l-4}" y="${P.t+8}" font-size="10" text-anchor="end" fill="var(--sub)">24h</text>${b}</svg>`;
}
function renderRisk(){
  const from=Math.max(0,S.i-59), to=Math.min(N-1,Math.max(S.i,from+59));
  const wk=Math.max(0,S.i-27), wet28=D.feat[S.prov].wet_hours_8_24c.slice(wk,S.i+1).reduce((s,v)=>s+(v||0),0);
  $("risk").innerHTML=`<h1>Weather</h1><div class="sub">${esc(prov().name)} · olive-area average · ${longDate(D.dates[S.i])}</div>
  <div class="card"><b>Temperature (°C), 60 days</b>${chart(from,to)}
   <div class="legend"><span><i style="background:var(--moderate)"></i>High</span><span><i style="background:var(--info)"></i>Low</span><span><i style="background:var(--high)"></i>30 / 35 °C lines</span><span>● alert day</span></div></div>
  <div class="card"><b>Leaf-wet hours per day</b><div class="sub" style="font-size:12px">Proxy for peacock-spot infection weather (8–24 °C with humidity ≥ 90 % or rain)</div>${wetBars(from,to)}
   <div class="sub" style="margin-top:6px">Last 28 days: <b style="color:var(--text)">${fmt(wet28,0)} h</b></div></div>
  <div class="card"><div class="tiles" style="margin-top:0"><div class="tile"><b>${fmt(F("rh_mean_pct"),0)}%</b><span>Humidity</span></div>
   <div class="tile"><b>${fmt(F("gust_max_ms")*3.6,0)}</b><span>Gust km/h</span></div><div class="tile"><b>${fmt(F("soil_moisture_l1"),2)}</b><span>Soil moist.</span></div>
   <div class="tile"><b>${fmt(F("pev_mm"),1)}</b><span>Evap. mm</span></div></div></div>
  <div class="sub" style="font-size:12px;margin:8px 4px">Source: ERA5-Land reanalysis (9 km), area-weighted over olive parcels from LPIS. Gusts come from a coarser grid.</div>`;
}
function renderField(){
  const date=D.dates[S.i], t0=new Date(date).getTime();
  const near=(D.obs[S.prov]||[]).filter(o=>Math.abs(new Date(o.d)-t0)<=21*864e5).sort((a,b)=>a.d.localeCompare(b.d));
  const cal=stagesOn(date).map(s=>STG[s]||s).join(", ")||"off-season";
  $("field").innerHTML=`<h1>Field reports</h1><div class="sub">What the Andalusian RAIF plant-health network reported near this date</div>
  <div class="card"><div class="row"><span class="sub">${esc(prov().name)} · ${longDate(date)}</span></div>
   <div class="kv"><div>Model stage</div><div>${esc(cal)} <span class="sub">(calendar estimate)</span></div></div></div>
  <h2>RAIF observations (±3 weeks)</h2>
  <div class="card">${near.length?near.map(o=>{const nm=MET[o.m]||o.m.replace(/_/g," "),val=o.n!=null?`${o.n}${o.u?" "+o.u.replace(/per_trap_day/,"/trap/day").replace(/_/g," "):""}`:(o.s||o.v||"");
    return `<div class="obs"><div>${esc(nm)}<small>${o.d} · ${esc(o.p.replace(/_/g," "))}${o.z?" · "+esc(o.z):""}</small></div><b>${esc(val)}</b></div>`}).join("")
    :`<div class="empty">${D.obs[S.prov]?"No RAIF report within 3 weeks of this date.":"RAIF reports cover Andalusia only."}</div>`}</div>
  <div class="sub" style="font-size:12px;margin:8px 4px">Report dates are approximate (month or part of month). Other regions have no ground-truth data yet.</div>`;
}
function renderAbout(){
  const bt=D.backtest||{}, ph=bt.phenology||{}, rp=bt.repilo_vs_wet_hours||{}, fl=bt.fly_punctured_vs_hot_days||{};
  const ne=Object.entries(D.not_evaluable).sort((a,b)=>b[1]-a[1]);
  $("about").innerHTML=`<h1>About</h1><div class="sub">Kairos · farm-level extreme-weather advice · Team 20</div>
  <div class="card"><b>How it works</b><p class="sub" style="margin:6px 0 0">Daily ERA5-Land weather is averaged over each province's olive area (from LPIS parcels) and checked against a decision table of ${D.meta.rules_evaluable+D.meta.rules_not_evaluable} literature-based rules by crop stage. Each alert carries an action, a lead time and its source. An agronomist must review every rule before it goes to farmers.</p></div>
  <h2>Back-test vs RAIF 2025 (Andalusia)</h2>
  <div class="card"><table>
   <tr><th>Test</th><th>Result</th></tr>
   <tr><td>Peacock spot vs wet hours</td><td>${rp.best?`ρ ${rp.best.spearman} (n=${rp.best.n}, p=${rp.best.p}) · moderate signal`:"n/a"}</td></tr>
   <tr><td>Flowering date (degree-days)</td><td>${ph.n_provinces!=null?`${ph.n_inside_window_pm15d} of ${ph.n_provinces} provinces within ±15 days · ~4 weeks late where it missed`:"n/a"}</td></tr>
   <tr><td>Olive fly vs hot days</td><td>${fl.best?`ρ ${fl.best.spearman} (n=${fl.best.n}, p=${fl.best.p}) · not significant`:"n/a"}</td></tr></table>
   <div class="sub" style="font-size:12px;margin-top:8px">One year, coarse dates. No thresholds were tuned. Treat as a sanity check, not validation.</div></div>
  <h2>Not evaluable from weather data</h2>
  <div class="card"><table>${ne.map(([r,n])=>`<tr><td>${esc(r)}</td><td>${n}</td></tr>`).join("")}</table></div>
  <h2>Limits</h2>
  <div class="card sub" style="font-size:13px">• Replay of reanalysis, not a live forecast<br>• Province averages, not single farms (farm boundaries come next)<br>• Leaf wetness is a humidity/rain proxy<br>• Hourly rules use the daily extreme<br>• Only Andalusia has ground truth</div>
  <div class="btns" style="margin:10px 0"><button class="pill" id="theme">Toggle dark / light</button></div>`;
  $("theme").onclick=()=>{const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue("--bg").trim()==="#000";r.dataset.theme=dark?"light":"dark"};
}
function render(){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===S.tab));
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===S.tab));
  ({today:renderToday,risk:renderRisk,field:renderField,about:renderAbout})[S.tab]();
  closeSheet();
}
render();
try{ if(new URLSearchParams(location.hash.slice(1)).get("sheet")){ const a=sortA(dayAlerts(S.prov,D.dates[S.i]))[0]; if(a) openSheet(a[0],a[4]); } }catch(e){}
</script>
</body>
</html>
